<!doctype html>
<html lang="en" data-kp-lesson-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive explanation of why a demand increase raises equilibrium price and quantity while supply remains fixed."
    />
    <title>Demand shifts and equilibrium · Kinetic Press</title>
    <script>
      const kpEconomicsRouteParameters = new URLSearchParams(location.search);
      document.documentElement.dataset.kpLessonTheme =
        kpEconomicsRouteParameters.get("theme") === "light"
          ? "light"
          : "dark";
      // Publication is the public default. Explicit layout URLs keep their
      // reversible presenter capability without flashing the static document.
      const kpEconomicsExplicitEnhancement =
        kpEconomicsRouteParameters.get("enhancement");
      document.documentElement.dataset.kpEconomicsEnhancement =
        kpEconomicsExplicitEnhancement === "presenter" ||
          (kpEconomicsExplicitEnhancement !== "published" &&
            kpEconomicsRouteParameters.has("layout"))
          ? "presenter"
          : "published";
    </script>
    <link
      rel="preload"
      href="/node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-300-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="/src/tutorial/economics-demand-shift/economics-demand-shift-theme.css"
    />
    <style>
      html, body, #app { min-height: 100%; }
      body { min-width: 320px; min-height: 100vh; margin: 0; }
      html[data-kp-lesson-theme="light"],
      html[data-kp-lesson-theme="light"] body {
        color: #263845;
        background: #f4f1e9;
        color-scheme: light;
      }
      html[data-kp-lesson-theme="dark"],
      html[data-kp-lesson-theme="dark"] body {
        color: #e8e7e2;
        background: #0d0e1c;
        color-scheme: dark;
      }
      html[data-kp-economics-enhancement="presenter"]
        [data-kp-economics-static-publication],
      html[data-kp-economics-enhancement="presenter"]
        [data-kp-economics-static-publication-styles] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"><!-- kp:economics-static-narrative --></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
