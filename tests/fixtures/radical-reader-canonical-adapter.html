        width: min(900px, calc(100% - 32px));

      [data-kp-editor-equation-material-layer] {
        position: absolute;
        inset: 0;

      [data-kp-equation-material-owner-id] {
        position: absolute;
        display: block;
        transform-origin: 0 0;

          inert

      <output data-kp-radical-adapter-status>Loading canonical session…</output>
